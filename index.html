<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <h1 class="title">Happy Wedding</h1>
            <p class="names">Taro & Hanako</p>
            <p class="date">2026.06.20</p>
        </div>
    </header>

    <main>
        <section class="reveal-box">
            <h2>Greeting</h2>
            <p>私たちは結婚いたします！<br>
               大切な皆様と楽しい時間を過ごせることを<br>
               心より楽しみにしています。</p>
        </section>

        <section class="reveal-box delay-1">
            <h2>Information</h2>
            <table class="info-table">
                <tr><th>Date</th><td>2026年6月20日 (土)</td></tr>
                <tr><th>Time</th><td>12:00 受付 / 13:00 開宴</td></tr>
                <tr><th>Place</th><td>ザ・ポップテラス 表参道</td></tr>
            </table>
        </section>

        <section class="reveal-box delay-2">
            <a href="#" class="rsvp-button">ご出席連絡はこちら</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Taro & Hanako</p>
    </footer>

</body>
</html>
