<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Bingo Machine</title>
    <style>
        /* --- 全体レイアウト --- */
        body {
            font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh; /* モバイルブラウザのアドレスバー対策 */
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            color: #333;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none; /* iOS Safari用 */
        }

        /* --- 上部：履歴エリア --- */
        #history-container {
            width: 100%;
            text-align: center;
            height: 12%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        h2 {
            font-size: 1rem;
            color: #666;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        .history-list {
            display: flex;
            justify-content: center;
            gap: 15px; /* デフォルトの隙間 */
        }

        .history-ball {
            width: 50px; height: 50px;
            background-color: #e0e0e0;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem; color: #555;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .history-ball.latest {
            background-color: #ff9800; color: white;
            transform: scale(1.15); border: 3px solid #fff;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.6);
        }

        /* --- 中央：メイン表示エリア --- */
        #main-display {
            flex-grow: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
        }

        #current-number {
            /* PC/プロジェクター用のサイズ基準 */
            font-size: min(35vw, 45vh);
            font-weight: 900;
            color: #222;
            line-height: 0.9;
            letter-spacing: -0.05em;
            text-shadow: 4px 4px 0px #fff, 8px 8px 0px rgba(0,0,0,0.15);
            margin-bottom: 10px;
        }

        #status-message {
            color: #e91e63;
            font-size: 2rem;
            font-weight: bold;
            height: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #debug-info {
            position: absolute;
            bottom: 0;
            right: 10px;
            font-size: 0.9rem; color: #aaa;
        }
