<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scrollable Bingo Machine</title>
    <style>
        /* --- 全体レイアウト (PC/プロジェクター用・基本設定) --- */
        body {
            font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            
            /* PCでは画面サイズ固定でスクロールさせない */
            height: 100vh;
            height: 100dvh;
            overflow: hidden; 
            
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            color: #333;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- 上部：履歴エリア --- */
        #history-container {
            width: 100%;
            text-align: center;
            height: 12%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0; /* 縮ませない */
        }
        
        h2 {
            font-size: 1rem; color: #666; margin: 0 0 5px 0; letter-spacing: 2px;
        }

        .history-list {
            display: flex; justify-content: center; gap: 15px;
        }

        .history-ball {
            width: 50px; height: 50px;
            background-color: #e0e0e0; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem; color: #555;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .history-ball.latest {
            background-color: #ff9800; color: white;
            transform: scale(1.15); border: 3px solid #fff;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.6);
        }

        /* --- 中央：メイン表示エリア --- */
        #main-display {
            flex-grow: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            min-height: 200px; /* 最低限の高さを確保 */
        }

        #current-number {
            font-size: min(35vw, 45vh);
            font-weight: 900; color: #222; line-height: 0.9;
            letter-spacing: -0.05em;
            text-shadow: 4px 4px 0px #fff, 8px 8px 0px rgba(0,0,0,0.15);
            margin-bottom: 10px;
        }

        #status-message {
            color: #e91e63; font-size: 2rem; font-weight: bold;
            height: 40px; text-transform: uppercase; letter-spacing: 2px;
            text-align: center;
        }

        #debug-info {
            position: absolute; bottom: 0; right: 10px; font-size: 0.9rem; color: #aaa;
        }

        /* --- 下部：ボタンエリア --- */
        #controls {
            height: 18%; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 30px;
            flex-shrink: 0; /* 縮ませない */
        }

        button {
            cursor: pointer; border: none; outline: none;
            transition: all 0.1s; font-weight: bold;
            font-size: 2rem; padding: 15px 60px;
            border-radius: 60px;
            box-shadow: 0 6px 0px rgba(0,0,0,0.15);
            white-space: nowrap;
        }

        #spin-btn { 
            background-color: #007aff; color: white; 
            border-bottom: 6px solid #0056b3; 
        }
        #spin-btn:hover { margin-top: 2px; border-bottom-width: 4px; box-shadow: 0 4px 0px rgba(0,0,0,0.15); }
        #spin-btn:active { margin-top: 6px; border-bottom-width: 0px; box-shadow: none; }
        #spin-btn:disabled { background-color: #ccc; border-bottom-color: #999; cursor: not-allowed; margin-top: 0; }

        #reset-btn {
            background-color: transparent; color: #ff3b30;
            border: 2px solid #ff3b30; font-size: 1rem; padding: 10px 20px;
            box-shadow: none;
        }
        #reset-btn:hover { background-color: #fff0f0; }


        /* =========================================
           レスポンシブ対応 (スマホ・タブレット用)
           ========================================= */
        @media (max-width: 768px) {
            body {
                /* ここが重要：スクロールを許可する設定に変更 */
                overflow-y: auto;       /* 縦スクロール許可 */
                height: auto;           /* 高さを固定しない */
                min-height: 100vh;      /* 最低でも画面いっぱいは使う */
                display: block;         /* Flexbox配置だとスクロールがバグりやすいのでBlockに戻す */
                padding-bottom: 50px;   /* 一番下が隠れないように余白 */
                text-align: center;
            }

            /* 各エリアのマージン調整 */
            #history-container {
                height: auto;
                margin-top: 20px;
                margin-bottom: 30px;
            }

            .history-list { gap: 8px; }
            .history-ball { width: 40px; height: 40px; font-size: 1rem; }

            #main-display {
                height: auto;
                min-height: 300px; /* 数字エリアの確保 */
                margin-bottom: 30px;
            }

            #current-number {
                /* スマホ用にサイズ調整 */
                font-size: 35vw; 
                text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.15);
            }

            #status-message { font-size: 1.5rem; }

            #controls {
                height: auto;
                flex-direction: row;
                gap: 15px;
                margin-bottom: 20px;
            }

            button { padding: 15px 30px; font-size: 1.5rem; }
            #reset-btn { padding: 10px 15px; font-size: 0.9rem; }
            
            #debug-info {
                position: relative; /* 絶対配置をやめて自然な位置へ */
                bottom: auto; right: auto;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="history-container">
        <h2>HISTORY</h2>
        <div class="history-list" id="history-list"></div>
    </div>

    <div id="main-display">
        <div id="current-number">00</div>
        <div id="status-message">READY?</div>
        <div id="debug-info">Remaining: 75</div>
    </div>

    <div id="controls">
        <button id="reset-btn" onclick="resetGame()">RESET</button>
        <button id="spin-btn" onclick="spin()">SPIN!</button>
    </div>

    <script>
        // ロジックに変更はありません
        const MAX_NUMBER = 75;
        const MIN_NUMBER = 1;
        let availableNumbers = [];
        let history = [];
        let isSpinning = false;

        function initGame() {
            availableNumbers = [];
            for (let i = MIN_NUMBER; i <= MAX_NUMBER; i++) {
                availableNumbers.push(i);
            }
            history = [];
            isSpinning = false;
            
            updateHistoryUI();
            document.getElementById('current-number').textContent = "00";
            document.getElementById('status-message').textContent = "READY?";
            document.getElementById('spin-btn').disabled = false;
            document.getElementById('spin-btn').textContent = "SPIN!";
            updateDebugInfo();
        }

        function spin() {
            if (isSpinning) return;
            if (availableNumbers.length === 0) return;

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('status-message').textContent = ""; 

            let count = 0;
            const display = document.getElementById('current-number');
            let speed = 50;
            const runAnimation = () => {
                const tempIndex = Math.floor(Math.random() * availableNumbers.length);
                display.textContent = availableNumbers[tempIndex];
                count++;
                if (count < 20) {
                    setTimeout(runAnimation, speed);
                } else if (count < 30) {
                    speed += 20; 
                    setTimeout(runAnimation, speed);
                } else {
                    finalizeNumber();
                }
            };
            runAnimation();
        }

        function finalizeNumber() {
            const winnerIndex = Math.floor(Math.random() * availableNumbers.length);
            const winnerNumber = availableNumbers[winnerIndex];

            if (winnerNumber === undefined || winnerNumber < MIN_NUMBER || winnerNumber > MAX_NUMBER) {
                alert("Error detected."); return;
            }

            availableNumbers.splice(winnerIndex, 1);
            history.unshift(winnerNumber);

            displayResult(winnerNumber);
            updateHistoryUI();
            updateDebugInfo();
            console.log(`Number: ${winnerNumber} / Remaining: ${availableNumbers.length}`);

            isSpinning = false;
            if (availableNumbers.length > 0) {
                document.getElementById('spin-btn').disabled = false;
                document.getElementById('spin-btn').focus();
            } else {
                document.getElementById('status-message').textContent = "FINISH!";
                document.getElementById('spin-btn').textContent = "END";
            }
        }

        function displayResult(number) {
            document.getElementById('current-number').textContent = number;
            const msg = document.getElementById('status-message');
            msg.textContent = "BINGO!"; 
            setTimeout(() => {
                if(!isSpinning) msg.textContent = ""; 
            }, 3000);
        }

        function updateHistoryUI() {
            const listElement = document.getElementById('history-list');
            listElement.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const div = document.createElement('div');
                div.className = 'history-ball';
                if (history[i]) {
                    div.textContent = history[i];
                    if (i === 0) div.classList.add('latest');
                } else {
                    div.textContent = '-';
                }
                listElement.appendChild(div);
            }
        }

        function updateDebugInfo() {
            document.getElementById('debug-info').textContent = `Remaining: ${availableNumbers.length}`;
        }

        function resetGame() {
            if(confirm('リセットしますか？')) {
                initGame();
            }
        }

        initGame();
    </script>
</body>
</html>
