<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bingo Machine</title>
    <style>
        /* --- 全体レイアウト --- */
        body {
            font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; /* 太めのフォントを優先 */
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh; /* 画面いっぱいに使う */
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            color: #333;
            overflow: hidden; /* スクロールバーを出さない */
            user-select: none;
        }

        /* --- 上部：履歴エリア --- */
        #history-container {
            width: 100%;
            text-align: center;
            height: 12%; /* 少し高さを抑える */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        h2 {
            font-size: 1rem;
            color: #666;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        .history-list {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .history-ball {
            width: 50px; height: 50px; /* 履歴も少し大きく */
            background-color: #e0e0e0;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem; color: #555;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        }

        .history-ball.latest {
            background-color: #ff9800; color: white;
            transform: scale(1.15); border: 3px solid #fff;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.6);
        }

        /* --- 中央：メイン表示エリア（ここを最大化） --- */
        #main-display {
            flex-grow: 1; /* 余ったスペースを全部使う */
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
        }

        #current-number {
            /* 画面サイズに合わせて巨大化する設定 */
            /* 画面の縦幅の45% または 横幅の35% のうち小さい方を採用 */
            font-size: min(35vw, 45vh); 
            font-weight: 900;
            color: #222;
            line-height: 0.9;
            letter-spacing: -0.05em; /* 数字の間隔を詰める */
            
            /* プロジェクター対策：強力な影をつけて視認性を高める */
            text-shadow: 
                4px 4px 0px #fff, 
                8px 8px 0px rgba(0,0,0,0.15);
            
            margin-bottom: 10px;
        }

        #status-message {
            color: #e91e63; /* 状態メッセージを目立つピンクに */
            font-size: 2rem;
            font-weight: bold;
            height: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 残り枚数表示（控えめに） */
        #debug-info {
            position: absolute;
            bottom: 0;
            right: 20px;
            font-size: 1rem; color: #aaa;
        }

        /* --- 下部：ボタンエリア --- */
        #controls {
            height: 15%;
            display: flex; align-items: center; gap: 30px;
        }

        button {
            cursor: pointer; border: none; outline: none;
            transition: all 0.1s; font-weight: bold;
            font-size: 2rem; /* ボタンの文字も大きく */
            padding: 15px 60px; /* ボタンサイズ自体も大きく */
            border-radius: 60px;
            box-shadow: 0 6px 0px rgba(0,0,0,0.15); /* 立体感を出す */
        }

        #spin-btn { 
            background-color: #007aff; color: white; 
            border-bottom: 6px solid #0056b3; /* 物理ボタンっぽい厚み */
        }
        
        #spin-btn:hover { margin-top: 2px; border-bottom-width: 4px; box-shadow: 0 4px 0px rgba(0,0,0,0.15); }
        #spin-btn:active { margin-top: 6px; border-bottom-width: 0px; box-shadow: none; }
        
        #spin-btn:disabled { 
            background-color: #ccc; border-bottom-color: #999; 
            cursor: not-allowed; margin-top: 0;
        }

        #reset-btn {
            background-color: transparent; 
            color: #ff3b30;
            border: 2px solid #ff3b30; 
            font-size: 1rem; padding: 10px 20px;
            box-shadow: none;
        }
        #reset-btn:hover { background-color: #fff0f0; }

    </style>
</head>
<body>

    <div id="history-container">
        <h2>これまで出た数字</h2>
        <div class="history-list" id="history-list"></div>
    </div>

    <div id="main-display">
        <div id="current-number">00</div>
        <div id="status-message">READY?</div>
        <div id="debug-info">Remaining: 75</div>
    </div>

    <div id="controls">
        <button id="reset-btn" onclick="resetGame()">RESET</button>
        <button id="spin-btn" onclick="spin()">SPIN!</button>
    </div>

    <script>
        /* ロジックは安全性が確認された v2 を継承しています 
           （重複なし・範囲内保証・ログ出力機能付き）
        */

        const MAX_NUMBER = 75;
        const MIN_NUMBER = 1;
        
        let availableNumbers = [];
        let history = [];
        let isSpinning = false;

        function initGame() {
            availableNumbers = [];
            for (let i = MIN_NUMBER; i <= MAX_NUMBER; i++) {
                availableNumbers.push(i);
            }
            history = [];
            isSpinning = false;
            
            updateHistoryUI();
            document.getElementById('current-number').textContent = "00";
            document.getElementById('status-message').textContent = "READY?";
            document.getElementById('spin-btn').disabled = false;
            document.getElementById('spin-btn').textContent = "SPIN!";
            updateDebugInfo();
        }

        function spin() {
            if (isSpinning) return;
            if (availableNumbers.length === 0) return;

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('status-message').textContent = ""; // 回転中はメッセージ消す

            let count = 0;
            const display = document.getElementById('current-number');
            
            // ドラムロールのような演出（少しずつ遅くする）
            let speed = 50;
            const runAnimation = () => {
                const tempIndex = Math.floor(Math.random() * availableNumbers.length);
                display.textContent = availableNumbers[tempIndex];
                count++;

                if (count < 20) {
                    setTimeout(runAnimation, speed);
                } else if (count < 30) {
                    speed += 20; // 少し遅くする
                    setTimeout(runAnimation, speed);
                } else {
                    finalizeNumber();
                }
            };
            runAnimation();
        }

        function finalizeNumber() {
            const winnerIndex = Math.floor(Math.random() * availableNumbers.length);
            const winnerNumber = availableNumbers[winnerIndex];

            // 安全装置
            if (winnerNumber === undefined || winnerNumber < MIN_NUMBER || winnerNumber > MAX_NUMBER) {
                alert("Error detected."); return;
            }

            availableNumbers.splice(winnerIndex, 1);
            history.unshift(winnerNumber);

            displayResult(winnerNumber);
            updateHistoryUI();
            updateDebugInfo();
            
            console.log(`Number: ${winnerNumber} / Remaining: ${availableNumbers.length}`);

            isSpinning = false;
            if (availableNumbers.length > 0) {
                document.getElementById('spin-btn').disabled = false;
                // 次のスピンのためにフォーカスをボタンに戻す（エンターキー連打対応）
                document.getElementById('spin-btn').focus();
            } else {
                document.getElementById('status-message').textContent = "FINISH!";
                document.getElementById('spin-btn').textContent = "END";
            }
        }

        function displayResult(number) {
            document.getElementById('current-number').textContent = number;
            // 結果が出た時のメッセージを大きく表示
            const msg = document.getElementById('status-message');
            msg.textContent = ""; 
            
            // 少ししたらメッセージを消す（数字を見やすくするため）
            setTimeout(() => {
                if(!isSpinning) msg.textContent = ""; 
            }, 3000);
        }

        function updateHistoryUI() {
            const listElement = document.getElementById('history-list');
            listElement.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const div = document.createElement('div');
                div.className = 'history-ball';
                if (history[i]) {
                    div.textContent = history[i];
                    if (i === 0) div.classList.add('latest');
                } else {
                    div.textContent = '-';
                }
                listElement.appendChild(div);
            }
        }

        function updateDebugInfo() {
            document.getElementById('debug-info').textContent = `Remaining: ${availableNumbers.length}`;
        }

        function resetGame() {
            if(confirm('リセットしますか？')) {
                initGame();
            }
        }

        initGame();
    </script>
</body>
</html>
